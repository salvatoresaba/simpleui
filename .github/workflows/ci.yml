name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify
        run: pwsh scripts/verify.ps1

      - name: Ensure clean tracked tree
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Error "Working tree is dirty after the build/tests:`n$dirty"
            exit 1
          }
