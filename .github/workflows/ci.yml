name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: go build -o simpleui.exe .

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

      - name: Check examples
        run: |
          ./simpleui.exe check examples/process_monitor/app.sui --json
          ./simpleui.exe check examples/state_machine/app.sui --json
          ./simpleui.exe check examples/chart/app.sui --json

      - name: Ensure clean tracked tree
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Error "Working tree is dirty after the build/tests:`n$dirty"
            exit 1
          }
